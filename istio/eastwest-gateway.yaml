# East-west gateway: the only door into this cluster's network for the other
# network. Rendered from samples/multicluster/gen-eastwest-gateway.sh of Istio
# 1.31.3 (--network NETWORK), with two changes:
#   - only 15021 (health) and 15443 (mTLS passthrough) are exposed; 15012 and
#     15017 serve a remote control plane (primary-remote), not this lab;
#   - the load balancer only accepts the other cloud's NAT address.
# scripts/02-istio.sh fills @NETWORK@, @PEER_CIDR@ and the cloud's annotations.
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: eastwest
spec:
  revision: ""
  profile: empty
  components:
    ingressGateways:
    - name: istio-eastwestgateway
      label:
        istio: eastwestgateway
        app: istio-eastwestgateway
        topology.istio.io/network: "@NETWORK@"
      enabled: true
      k8s:
        env:
        # traffic through this gateway should be routed inside the network
        - name: ISTIO_META_REQUESTED_NETWORK_VIEW
          value: "@NETWORK@"
        serviceAnnotations: {}
        service:
          loadBalancerSourceRanges:
          - "@PEER_CIDR@"
          ports:
          - name: status-port
            port: 15021
            targetPort: 15021
          - name: tls
            port: 15443
            targetPort: 15443
  values:
    gateways:
      istio-ingressgateway:
        injectionTemplate: gateway
    global:
      network: "@NETWORK@"
